plugins {
    id 'com.android.application' version '9.3.0'
}

android {
    namespace = 'vic.software.androidpokedex'
    compileSdk = 37

    defaultConfig {
        applicationId = 'vic.software.androidpokedex'
        minSdk = 23
        targetSdk = 37
        versionCode = 2
        versionName = '2.0.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Keep the original sources and assets; never compile the old gen/ or bin/.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
        test.java.srcDirs = ['tests/unit']
        androidTest.java.srcDirs = ['tests/android']
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // Keep the first modern release easy to diagnose on older devices.
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}